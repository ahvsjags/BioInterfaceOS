name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python 3.11 and locked development environment
        run: uv sync --frozen --python 3.11
      - name: Run offline quality checks
        env:
          UV_OFFLINE: "1"
        run: make check
