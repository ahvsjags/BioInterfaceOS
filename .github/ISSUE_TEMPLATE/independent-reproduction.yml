name: Independent reproduction or external use
description: Submit a non-author reproduction or independent user report for BioInterfaceOS.
title: "Independent reproduction/use report: "
labels:
  - external-reproduction
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload protected row-level data, credentials, or private human data. Use the fixed `v0.1.3-r10.57` release at commit `3557fac2019e57fd8968cdcf55b106750eafa750` and follow `docs/external/R4_T286_CURRENT_EXTERNAL_HANDOFF_20260815.md`. The receipt-preflight overlay is on coordination branch `r3-real-data-execution-20260813`; scientific execution must remain on the fixed tag.
        This form is for a genuinely non-author reproduction or external real-task use; an issue submission is not counted until identity, conflict, provenance, environment and output hashes are independently audited.
  - type: dropdown
    id: role
    attributes:
      label: Participation role
      description: Select the evidence role you can perform.
      options:
        - No-author accession-to-result reproduction
        - External real-task adoption
        - Protected lockbox evaluator (coordinate privately; do not attach protected data)
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Team and institution
      description: State the team/institution or choose anonymous with a private contact route.
    validations:
      required: true
  - type: textarea
    id: conflict
    attributes:
      label: Conflict disclosure
      description: Disclose authorship, project control, funding or other relevant relationships.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Checkout commit or tag
      placeholder: v0.1.3-r10.57 / 3557fac2019e57fd8968cdcf55b106750eafa750
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Task and input scope
      description: Describe what was run and where the inputs came from.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and commands
      description: Include OS, dependency/container digest, commands and test output.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results, failures and output hashes
      description: Report successes and failures; attach or link an immutable receipt when possible.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication consent
      options:
        - label: I confirm that this report contains no credentials or protected row-level data and may be publicly visible.
          required: true
