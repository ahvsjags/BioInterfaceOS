<text x="32.0" y="496.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="normal" fill="#374151">Each tracked asset is classified by declared rights and provenance before it can enter a public bundle. This</text>
<text x="32.0" y="513.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="normal" fill="#374151">is a release-control protocol, not a data result.</text>
<text x="32.0" y="533.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#4B5563">Units, n and intervals: not applicable (protocol diagram; no measured summary).</text>
