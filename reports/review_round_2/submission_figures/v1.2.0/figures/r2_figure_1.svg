<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="90mm" viewBox="0 0 960 540" role="img">
<title>Evidence-class boundary for fixture and replay outputs</title>
<desc>Protocol-only diagram from declared nodes and edges; no empirical values.</desc>
<rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>
<text x="32.0" y="40.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15px" font-weight="bold" fill="#374151">R2 Figure 1</text>
<text x="32.0" y="70.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25px" font-weight="bold" fill="#111827">Evidence-class boundary for fixture and replay outputs</text>
<text x="928.0" y="38.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="bold" fill="#374151">PROTOCOL / SOFTWARE REPLAY ONLY</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#374151"/></marker></defs>
<line x1="224.0" y1="226.0" x2="292.0" y2="226.0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="258.0" y="219.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#374151">declare</text>
<line x1="472.0" y1="226.0" x2="548.0" y2="162.0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510.0" y="187.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#374151">permitted</text>
<line x1="472.0" y1="226.0" x2="548.0" y2="350.0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510.0" y="281.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#374151">prohibit</text>
<rect x="44.0" y="190.0" width="180.0" height="72.0" rx="10" fill="#DCEAF7" stroke="#0072B2" stroke-width="2"/>
<text x="134.0" y="222.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Fixture / replay</text>
<text x="134.0" y="242.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="normal" fill="#111827">inputs</text>
<rect x="292.0" y="190.0" width="180.0" height="72.0" rx="10" fill="#E5F4E8" stroke="#009E73" stroke-width="2"/>
<text x="382.0" y="222.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Evidence-class</text>
<text x="382.0" y="242.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="normal" fill="#111827">declaration</text>
<rect x="548.0" y="126.0" width="180.0" height="72.0" rx="10" fill="#EAE4F4" stroke="#6A3D9A" stroke-width="2"/>
<text x="638.0" y="158.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Contract-test</text>
<text x="638.0" y="178.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="normal" fill="#111827">output only</text>
<rect x="548.0" y="314.0" width="180.0" height="72.0" rx="10" fill="#FBE2E2" stroke="#D55E00" stroke-width="2"/>
<text x="638.0" y="346.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="bold" fill="#111827">Scientific claim</text>
<text x="638.0" y="366.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="normal" fill="#111827">blocked</text>
<line x1="32" y1="474" x2="928" y2="474" stroke="#D1D5DB" stroke-width="1"/>
<text x="32.0" y="496.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="normal" fill="#374151">Declared evidence classes route fixture or replay inputs to contract-level output and block unsupported</text>
<text x="32.0" y="513.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="normal" fill="#374151">scientific claims. This protocol diagram contains no measured values.</text>
<text x="32.0" y="533.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12px" font-weight="normal" fill="#4B5563">Units, n and intervals: not applicable (protocol diagram; no measured summary).</text>
</svg>
