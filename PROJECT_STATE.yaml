  - '2026-08-12: T118 completed a clean public-source software replay with 668 registered public assets, a source manifest, SBOM, deterministic archive, JUnit receipt, and three rebuilt protocol figures. It explicitly reports scientific_reproduction=false and scientific_submission_ready=false.'
  - '2026-08-12: T120 admitted one CC BY 4.0 anonymous-public primary dataset (DOI 10.5518/1171), retained four hashed raw XLSX assets, and audited 14 GUV observations back to original worksheet cells. It is development observation evidence only; independent validation and scientific submission readiness remain false.'
  - '2026-08-12: T121 froze source-level units, development-only estimands, study-held-out nested-selection requirements, cluster-aware interval rules, multiplicity and missingness policy. It runs no outcome analysis or model fit; one-study held-out evaluation remains unavailable.'
  - '2026-08-12: T122 admitted three CC BY 4.0 anonymous-public studies from distinct laboratories and froze leave-one-study-out raw-cell locator evaluation. The receipt publishes source admission, raw predictions, coverage, calibration and study-clustered interval artifacts, but it is explicitly not biological, predictive, external, or independent validation.'
  - '2026-08-12: T125 completed a source-verified external evidence packet with 12 citations, 8 nearest-neighbour comparators, two non-overlapping R2 manuscript scopes and seven operational glossary terms. It preserves the T123/T124 blockers and does not retroactively clear historical fixture manuscripts.'
  - '2026-08-12: T123 source expansion checksum-verified three open raw-table candidate packages, but the declared metrics are hydrodynamic mean, Z-average, and an unspecified hydrodynamic-size statistic. The strict audit preserves a non-admission receipt; model fitting, ablations, OOD and independent validation remain false.'
  - '2026-08-12: T123 public-source discovery independently screened two 2024 CC-BY records and reserved one post-freeze CC-BY record. One DLS workbook releases Mean +/- SEM summaries without a matched biological-condition protocol, the other releases only a figure index; the post-freeze source was not consumed. The strict discovery receipt preserves zero admissions.'
  - '2026-08-12: T123 proteomics source preflight screened PXD017776, PXD052701 and PXD032162: three independently generated pre-cutoff CC0 human protein-corona records with 30 source-defined run/acquisition-mix records. The receipt preserves target_frozen=false and model_fitted=false; PXD052701 still needs a source-matched material/size covariate map and all author-specific quantitative outputs remain segregated pending one common preprocessing rule.'
  - '2026-08-13: T123 now fixes a 27-asset anonymous-HTTPS PRIDE transfer manifest and a resumable verifier. It records publisher SHA-1 where released, exact source byte counts where checksum metadata are unavailable, local SHA-256 for every completed file, and append-only transfer events under ignored raw storage. Completion of this transfer is explicitly not target admission, model fitting, OOD evaluation, or scientific readiness.'
  - '2026-08-13: T123 candidate screening rejected PXD017429. Its small author-result archive exposes 20 source-named runs but all inspected protein records are Bos taurus; it is not substituted into the frozen human-biofluid cohort and is not called cross-species validation.'
  - '2026-08-13: T123 completed a strict profile of 23 transferred author-result files from PXD017776, PXD052701 and PXD032162. The real detection-set evidence confirms zero compatible cross-study predictive targets: PXD052701 has unresolved L/S covariates, PXD032162 has one combined protein result for eight mixes, and no common abundance endpoint or study-held-out feature space is frozen. Model fitting, ablations, OOD and independent validation remain false; T129 is opened for CC0 target admission and a versioned analysis-plan amendment.'
  - '2026-08-13: T129 strict-screened two additional official pre-cutoff CC0 human protein-corona workbooks from Leiden University (PXD016229) and Sapienza University of Rome (PXD054751). They provide two laboratories and nine source-labelled conditions, but neither selected source asset maps units to numeric material/size covariates, their author quantification scales remain segregated, and replicate roles are unresolved. The immutable receipt records BLOCKED_NO_CC0_COMMON_TARGET; T121 Amendment v1.0.1, model fitting, ablations, OOD and independent validation remain prohibited.'
  - '2026-08-13: T129 separately expanded first-party CC0 screening to PXD053359 and PXD050779, both Michigan State University human-plasma top-down-proteomics sources. Seven hashed result assets expose S2/S4 or Corona1/2/3 source labels, not source-matched numeric covariates or frozen biological units; the one-laboratory tranche has no common cross-study endpoint. The immutable discovery receipt records BLOCKED_CC0_EXPANSION_NO_SOURCE_MATCHED_NUMERIC_COVARIATES, so T121 Amendment v1.0.1 and all model, OOD and independent-validation work remain prohibited.'
  - '2026-08-13: T129 completed a metadata-first official PRIDE API discovery screen for six additional high-priority CC0 human corona/plasma leads. The scoped project and file-listing evidence did not provide a source-matched, unit-level numeric material/size covariate map or a common endpoint; each lead is narrowly NOT_ADMITTED_WITH_SCREENED_LISTING rather than universally excluded. The search protocol, inspected page scope and reassessment criteria are retained in docs/data/R2_T129_CC0_PRIDE_API_DISCOVERY_LOG.md; no bulk download, label inference or model fitting was authorized.'
  - '2026-08-13: T129 consolidated the current first-party screening receipts: six candidate sources from five laboratories and twenty-four verified source assets remain BLOCKED_NO_CROSS_LAB_COMMON_NUMERIC_MATERIAL_TARGET. PXD030327 supplies 636 source-mapped units across 819 matrix runs, but its numeric P/NP field is an exposure rather than a material/size covariate, NP labels remain categorical identity features, and the study is single-laboratory. Zero targets are frozen; all model, OOD and independent-validation fields remain false.'
  - '2026-08-13: T126/T128 v1.2 now bind the consolidated T129 receipt into both protocol manuscripts and the final acceptance gate. The former two local T129 blockers are intentionally represented as one current cross-laboratory numeric-material target gate, leaving nine explicit acceptance blockers. This is a provenance consolidation only; external reproduction, editorial re-review and scientific submission readiness remain false.'
  - '2026-08-13: T126/T127 portfolio and T128 acceptance-readiness audits were versioned to bind the current T123 23-profile result receipt and both T129 CC0 non-admission receipts alongside the original compatibility/evaluator boundaries. The merged A+B and results-blind C outlines now state those data-coverage findings directly; the audit fails closed if a current receipt is altered to imply a frozen target. This strengthens protocol traceability only: model, evaluator, external reproduction, editorial re-review and scientific submission readiness remain false.'
  - '2026-08-13: T130 completed a strict licence-bound mapping precheck after official PRIDE metadata and two RSC articles showed that scientific source mapping and reuse rights can diverge. It keeps the CC0 cohort unchanged: PXD052701 has a CC0 result release but its LF-L/LF-S size and formulation mapping is published under CC BY-NC 3.0, while the independently generated CC BY 3.0 C9NR08186K supplementary assets remain unverified behind a Cloudflare challenge and do not yet establish a common source-level endpoint. The immutable receipt records three routes and three laboratories, but zero public-redistributable complete maps and zero shared cross-study endpoints. No target, model fit, external evaluation or submission claim is enabled.'
  - '2026-08-13: T131 completed a strict but asset-scoped public-source audit for PXD017052. It verified four official CC-BY publisher assets, nine result-to-raw basename joins and three numeric SPION records. Its no-crosswalk conclusion applies only to those assets and is superseded by the separate T132 correction below.'
  - '2026-08-13: T132 verified all eight publisher attachments omitted from T131 v1.0. Supplementary Data 6 explicitly maps every one of the nine T131 result/raw units to SP-003-001, SP-007-002 or SP-011-001 and a replicate number. This completes a public CC-BY single-laboratory route, but does not alter the frozen CC0 cohort, establish a second independent laboratory or authorize model use.'
  - '2026-08-13: T129 current evidence v1.2 now binds both the scoped T131 receipt and the complete T132 correction. The consolidated screen covers six candidate sources from five laboratories and twenty-four verified assets, yet still has zero admitted cross-laboratory numeric-material targets and nine acceptance blockers.'
  - '2026-08-13: T133 published a strict external-evidence handoff package that freezes required source and analysis-unit fields, CC0/CC-BY routing, T121 freeze items and external evaluator/reproduction safeguards. Its receipt confirms readiness for external source intake only: no source has been received, no protected data were accessed, and no evaluator, reproducer, editor or scientific submission result exists.'
  - '2026-08-13: T134 corrected a technical publication discrepancy found by visual/file-metadata review: v1.1.0 protocol PNG exports had 600-dpi pixel dimensions but no embedded pHYs resolution metadata. The v1.2.0 suite was rebuilt from SVG with 23,622 pixels-per-metre pHYs metadata and bound to refreshed public-release, software-replay, portfolio, acceptance, remediation and external-handoff receipts; it remains protocol-only and scientific submission readiness is false.'
