  - '2026-08-12: T120 admitted one CC BY 4.0 anonymous-public primary dataset (DOI 10.5518/1171), retained four hashed raw XLSX assets, and audited 14 GUV observations back to original worksheet cells. It is development observation evidence only; independent validation and scientific submission readiness remain false.'
