  - '2026-08-12: T124 now has a strict external-evaluator readiness protocol that binds the T123 compatibility receipt, requires an independent evaluator and aggregate-only protected-data handoff, and fails closed with a blocked receipt while zero compatible targets and zero frozen real-model outputs exist. It does not create an evaluator receipt or scientific result.'
  - '2026-08-12: T126/T127 now have a strict two-route R2 portfolio: one merged A+B provenance/source-locator protocol and one results-blind C protocol. It excludes all three historical fixture manuscripts, binds three protocol-only figures and 15 legacy withdrawals, and remains blocked on T123/T124 rather than implying a result manuscript.'
  - '2026-08-12: T128 now has a strict external-reproduction and editorial-re-review protocol plus `project accept-r2 --strict`. The current receipt records six missing prerequisites and keeps external reproduction, editorial re-review and scientific submission readiness false.'
