[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "biointerfaceos"
version = "0.1.3"
description = "Provenance-grounded AI-for-Science for biomedical material biointerfaces"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = ["duckdb==1.5.5", "numpy==2.4.6", "openpyxl==3.1.5", "pyarrow==17.0.0", "pyyaml==6.0.2"]

[project.scripts]
biointerfaceos = "biointerfaceos.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.2",
    "ruff==0.12.12",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
