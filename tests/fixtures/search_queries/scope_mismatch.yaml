schema_version: 1
matrix_version: 2026.08.12-dev.1
date_firewall:
  train_end: '2023-12-31'
  validation_start: '2024-01-01'
  validation_end: '2024-12-31'
  lockbox_start: '2025-01-01'
  lockbox_end: '2026-08-11'
queries:
- id: epmc-train-01
  source: europe_pmc
  axis: material
  scope: validation
  query: TITLE_ABS:("liposome" OR "lipid nanoparticle" OR LNP)
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Cover the frozen lipid/liposome material family.
- id: epmc-train-02
  source: europe_pmc
  axis: corona
  scope: train
  query: TITLE_ABS:("protein corona" OR "biomolecular corona")
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Cover protein-corona terminology.
- id: epmc-train-03
  source: europe_pmc
  axis: endpoint
  scope: train
  query: TITLE_ABS:(nanoparticle AND ("cellular uptake" OR internalization OR endocytosis))
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Cover cellular uptake endpoints.
- id: epmc-train-04
  source: europe_pmc
  axis: protocol
  scope: train
  query: TITLE_ABS:(nanoparticle AND (incubation OR dose OR concentration OR "exposure
    time"))
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Recover protocol and exposure terms.
- id: epmc-train-05
  source: europe_pmc
  axis: species
  scope: train
  query: TITLE_ABS:((human OR mouse) AND (plasma OR serum) AND nanoparticle)
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Separate human/mouse biofluid context.
- id: epmc-train-06
  source: europe_pmc
  axis: assay
  scope: train
  query: TITLE_ABS:((viability OR cytotoxicity OR complement OR cytokine) AND nanoparticle)
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Cover toxicity and immune assay vocabulary.
- id: epmc-train-07
  source: europe_pmc
  axis: data_code
  scope: train
  query: TITLE_ABS:(nanoparticle AND (proteomics OR "supplementary data" OR dataset
    OR code))
  date_from: '2000-01-01'
  date_to: '2023-12-31'
  cursor_strategy: cursorMark
  rationale: Find structured data and reproducible code links.
